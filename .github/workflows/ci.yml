name: CI (tests)

# Always-green check: runs the test suite, needs no API secrets.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (no TensorFlow needed for tests)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib python-dotenv requests pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short
