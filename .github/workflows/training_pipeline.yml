name: Training Pipeline (daily)

on:
  schedule:
    - cron: "0 2 * * *"       # daily 02:00 UTC
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          # No TensorFlow in CI: hopsworks needs protobuf<5, TF 2.21 needs
          # protobuf>=6.31 — irreconcilable. LSTM is skipped (train_lstm returns
          # None when TF absent); Ridge + RandomForest still train + push.
          pip install numpy pandas scikit-learn joblib python-dotenv requests \
            "hopsworks[python]==4.7.5" "sqlalchemy>=2.0,<2.1" "PyMySQL>=1.1" pyarrow
      - name: Run training pipeline (auto-seeds if store thin; exits 0)
        run: python scripts/run_training_pipeline.py --days 90
