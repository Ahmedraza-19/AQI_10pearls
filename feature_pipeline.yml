name: Feature Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"      # every hour
  workflow_dispatch:          # manual seed/backfill trigger

jobs:
  feature:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn joblib python-dotenv requests \
            "hopsworks[python]==4.7.5" "sqlalchemy>=2.0,<2.1" "PyMySQL>=1.1" pyarrow
      - name: Run feature pipeline (exits 0 on data gaps)
        run: python scripts/run_feature_pipeline.py
